
name: Publicar EL EDITOR
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule: 
    - cron: '*/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar motor editorial                    
        run: unzip -q EL_EDITOR_v185_motor.zip -d "$RUNNER_TEMP/editor"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar soporte de imágenes
        run: python -m pip install Pillow
      - name: Recuperar reserva y rotaciones
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/editor/engine/reserva_youtube_v173.json
            ${{ runner.temp }}/editor/engine/canales_api_v173.json
            ${{ runner.temp }}/editor/engine/videos_v166.json
            ${{ runner.temp }}/editor/engine/historial_videos_v166.json
            ${{ runner.temp }}/editor/engine/traducciones_v166.json
            ${{ runner.temp }}/editor/engine/titulares_v174.json
          key: editor-v173-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: editor-v173-
      - name: Recopilar noticias y vídeos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python "$RUNNER_TEMP/editor/engine/recopilador_v172.py" --online
      - name: Guardar reserva y rotaciones
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/editor/engine/reserva_youtube_v173.json
            ${{ runner.temp }}/editor/engine/canales_api_v173.json
            ${{ runner.temp }}/editor/engine/videos_v166.json
            ${{ runner.temp }}/editor/engine/historial_videos_v166.json
            ${{ runner.temp }}/editor/engine/traducciones_v166.json
            ${{ runner.temp }}/editor/engine/titulares_v174.json
          key: editor-v173-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Descargar diagnóstico de canales
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-youtube
          path: ${{ runner.temp }}/editor/engine/diagnostico_candidatos_v168.csv
      - name: Preparar edición pública
        run: python "$RUNNER_TEMP/editor/engine/publicar_v173.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/site"
      - name: Obtener redacción privada
        uses: actions/checkout@v4
        with:
          repository: alvaropalacios100/EL-EDITOR-REDACCION
          token: ${{ secrets.REDACCION_READ_TOKEN }}
          path: redaccion-privada
          persist-credentials: false
      - name: Publicar artículos propios
        run: python "$RUNNER_TEMP/editor/engine/redaccion_v180.py" "$RUNNER_TEMP/site" "$GITHUB_WORKSPACE/redaccion-privada"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

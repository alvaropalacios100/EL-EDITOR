<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL EDITOR · Redacción</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{background:#f5eedc;color:#211f1b;font:17px Georgia;margin:0}main{max-width:760px;margin:auto;padding:20px}h1{text-align:center;font-size:48px;margin:0}header{text-align:center;border-bottom:3px double;padding:12px}label{display:block;margin-top:14px}input,select,textarea,button{font:16px Arial;padding:12px;border:1px solid #a99b83;border-radius:5px;width:100%;background:#fffdf7;color:#211f1b}button{background:#29251f;color:white;margin-top:10px;cursor:pointer}textarea{min-height:220px}article{border-bottom:1px solid #a99b83;padding:15px 0}small{color:#665b4c}img{max-width:100%}#preview{white-space:pre-wrap}button:disabled{opacity:.5}</style><main><header><h1>EL EDITOR</h1>DIARIO DE INFORMATIVOS · REDACCIÓN v1.8.4</header><section id="login"><p>Acceso privado mediante GitHub. La clave permanece únicamente en memoria mientras esta página está abierta.</p><label>Token de redacción<input id="token" type="password" autocomplete="off"></label><button id="connect">Conectar</button></section><section id="app" hidden><button id="logout">Cerrar sesión</button><h2>Nuevo artículo / editar</h2><form id="form"><label>Sección<select id="section"><option>Editorial</option><option>Cinematógrafo</option></select></label><label>Titular<input id="title" required maxlength="250"></label><label>Subtítulo<input id="subtitle"></label><label>Firma<input id="author" value="El Editor"></label><label>Contenido<textarea id="body" required></textarea></label><label>Imagen (JPG, PNG o WebP, máximo 750 KB)<input id="image" type="file" accept="image/jpeg,image/png,image/webp"></label><button type="button" id="removeImage">Quitar imagen</button><label>Estado<select id="status"><option value="draft">Borrador</option><option value="scheduled">Programar</option><option value="immediate">Publicar ahora</option></select></label><label>Fecha de publicación (Madrid)<input id="date" type="date"></label><button type="button" id="showPreview">Vista previa</button><button type="submit" id="save">Guardar artículo</button><p id="saveFeedback" role="status" aria-live="polite"></p><button type="button" id="newArticle">Nuevo artículo</button></form><div id="preview" hidden></div><p id="message" role="status"></p><h2>Archivo y calendario</h2><div id="list"></div><p><a href="https://github.com/alvaropalacios100/EL-EDITOR/actions/workflows/publicar.yml" target="_blank" rel="noopener">Publicar ahora: abrir GitHub Actions → Run workflow</a></p></section><p id="error" role="alert"></p></main><script>
const $=id=>document.getElementById(id), endpoint='https://api.github.com/repos/alvaropalacios100/EL-EDITOR-REDACCION/contents/articulos.json';let connecting=false,sessionKey='',rows=[],sha='',editing='',image='';const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Madrid'}).format(new Date());const encode=s=>{let b=new TextEncoder().encode(s),v='';for(let i=0;i<b.length;i+=8192)v+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(v)};const decode=s=>new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));async function api(method='GET',body){
 const key=sessionKey.trim(); if(!key)throw Error('Sesión sin credencial. Vuelve a conectar.');
 const headers={Authorization:'Bearer '+key,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
 if(body)headers['Content-Type']='application/json';
 const url=endpoint+(method==='GET'?'?ref=main':'');
 let r;try{r=await fetch(url,{method,headers,cache:'no-store',redirect:'error',credentials:'omit',body:body?JSON.stringify(body):undefined})}catch(e){throw Error(method+' — conexión con GitHub fallida: '+e.message)}
 let data;try{data=await r.json()}catch{throw Error(method+' — respuesta no válida de GitHub ('+r.status+')')}
 if(!r.ok)throw Error(method+' — GitHub '+r.status+' '+(data.message||'')+' (referencia: '+(r.headers.get('x-github-request-id')||'no disponible')+')');return data;
}async function load(){let d=await api();sha=d.sha;if(d.content){rows=JSON.parse(decode(d.content))}else{let r=await fetch(endpoint+'?ref=main',{cache:'no-store',redirect:'error',credentials:'omit',headers:{Authorization:'Bearer '+sessionKey,Accept:'application/vnd.github.raw+json'}});if(!r.ok)throw Error('No se pudo leer el archivo');rows=await r.json()}render()}async function persist(next){let current=await api();if(current.sha!==sha)throw Error('El archivo cambió desde que lo abriste. Copia tu texto y vuelve a conectar antes de guardar.');let d=await api('PUT',{message:'Actualizar archivo de Redacción',content:encode(JSON.stringify(next,null,2)),sha:current.sha,branch:'main'});sha=d.content.sha;rows=next;render()}function reset(){editing='';image='';HTMLFormElement.prototype.reset.call($('form'));$('date').value=today();$('preview').hidden=true}function render(){let list=$('list');list.replaceChildren();for(let a of [...rows].sort((a,b)=>b.date.localeCompare(a.date))){let el=document.createElement('article'),h=document.createElement('strong');h.textContent=a.title;el.append(h,document.createElement('br'));let info=document.createElement('small');info.textContent=a.section+' · '+a.date+' · '+({draft:'Borrador',scheduled:'Programado',immediate:'Publicación inmediata'}[a.status]);el.append(info);for(let [label,fn] of [['Editar',()=>{editing=a.id;image=a.image||'';for(let k of ['section','title','subtitle','author','body','status','date'])$(k).value=a[k]||'';window.scrollTo(0,0)}],['Eliminar',async()=>{if(confirm('¿Eliminar este artículo? Se retirará de la web en la próxima publicación.'))try{await persist(rows.filter(x=>x.id!==a.id))}catch(e){$('error').textContent=e.message}}]]){let b=document.createElement('button');b.textContent=label;b.onclick=fn;el.append(b)}list.append(el)}}$('connect').onclick=async()=>{if(connecting||sessionKey)return;const candidate=$('token').value.trim();if(!candidate){$('error').textContent='Introduce el token de escritura.';return}connecting=true;$('connect').disabled=true;sessionKey=candidate;try{await load();$('login').hidden=true;$('app').hidden=false;reset();$('error').textContent='';$('token').value=''}catch(e){sessionKey='';$('login').hidden=false;$('app').hidden=true;$('error').textContent=e.message}finally{connecting=false;$('connect').disabled=false}};$('logout').onclick=()=>{sessionKey='';location.reload()};$('newArticle').onclick=reset;$('removeImage').onclick=()=>{image='';$('image').value=''};$('image').onchange=async()=>{let f=$('image').files[0];if(!f)return;if(f.size>750000||!['image/jpeg','image/png','image/webp'].includes(f.type)){alert('Imagen no válida o demasiado grande');$('image').value='';return}let r=new FileReader();r.onload=()=>image=r.result;r.readAsDataURL(f)};function newId(){if(globalThis.crypto?.randomUUID)return crypto.randomUUID();const b=new Uint8Array(16);crypto.getRandomValues(b);b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;const h=Array.from(b,x=>x.toString(16).padStart(2,"0")).join("");return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20)}function article(){let a={id:editing||newId(),image};for(let k of ['section','title','subtitle','author','body','status','date'])a[k]=$(k).value;if(a.status==='immediate')a.date=today();if(!a.date)a.date=today();return a}$('showPreview').onclick=()=>{let a=article(),p=$('preview');p.hidden=false;p.replaceChildren();for(let [tag,t] of [['h2',a.title],['p',a.subtitle],['small',a.author+' · '+a.date],['p',a.body]]){let e=document.createElement(tag);e.textContent=t;p.append(e)}if(image){let i=document.createElement('img');i.src=image;p.append(i)}};$('form').onsubmit=async e=>{e.preventDefault();if($('save').disabled)return;$('saveFeedback').textContent='';try{let a=article();if(a.status==='scheduled'&&a.date<=today()){alert('Para programar, elige una fecha futura. Para hoy usa Publicar ahora.');return}if(!a.title.trim()||!a.body.trim())return;$('save').disabled=true;$('saveFeedback').textContent='Guardando en GitHub…';await persist([...rows.filter(x=>x.id!==a.id),a]);$('message').textContent=a.status==='immediate'?'Guardado. Abre GitHub Actions y pulsa Run workflow para publicar ahora.':'Artículo guardado.';$('saveFeedback').textContent=$('message').textContent;reset()}catch(e){$('saveFeedback').textContent='No se ha podido guardar: '+e.message;$('error').textContent=e.message}finally{$('save').disabled=false}};
</script></html>
